# Entries appear in the order listed here, so keep newest first within each status.

- status: project
  title: "Proving Loyalty, Losing Capacity: Military Purges and Wartime Violence Against Civilians"
  coauthors: "Jun Koga Sudduth"
  venue: "Under review"
  summary: >-
    This project looks at the interplay between two troubling forms of
    autocratic behaviour, the use of purges to deepen personal control of the
    military, and the tendency to commit violence against the civilian
    population during civil conflict. We find that different types of purges
    have countervailing effects on civilian victimization: large-scale purges
    disrupt military capacity, leading to lower levels of civilian
    victimization, while top-ranking purges install new officers who can display
    their loyalty by carrying out atrocities. These effects operate on different
    timescales: the loyalty effect comes into play within the first few years,
    while capacity degradation takes longer to propagate through the military.
  image: purges.png

- status: project
  title: "The Tip of the Iceberg: Estimating Underreported Transnational Repression with a Latent Network Model"
  coauthors: "Howard Liu and Shahryar Minhas"
  venue: "Working paper"
  summary: >-
    A troubling and increasingly salient modern phenomenon is that autocratic
    repression no longer seems to respect state borders. A growing body of
    quantitative research relies largely on news reports of the most violent and
    visible forms of repression, ignoring that autocracies are strategic actors
    that often have a strong interest in avoiding detection. In this project we
    apply a novel network model to see if we can detect covert and latent
    transnational repression, and identify so-called "dark dyads," cases where
    our model would predict high levels of repression but none is reported. We
    evaluate these dyads using both out-of-sample testing and cross-checking
    against qualitative records of China's repression of the Uyghur diaspora.
  image: tnr.png

- status: project
  title: "Rashomon Histories: What the Data Support Is Bigger Than What We Report"
  coauthors: "Alan van Beek, Scott de Marchi, John Nagl, and eleven undergraduate co-authors"
  venue: "Working paper"
  summary: >-
    Empirical work in international relations often hinges on a small number of
    important historical cases. Yet these cases are coded based on a contested
    (and changing) historiography, where multiple defensible codings of the same
    case can coexist. This is particularly true of an important topic like
    nuclear bargaining. In this project, we examine the historiography around
    nuclear crises and develop a new technique that assesses how sensitive a
    particular model is to historiographic uncertainty. We apply this technique
    to the role of nuclear weapons in crisis bargaining, and confirm research
    showing that nuclear states are more likely to prevail over non-nuclear
    states, but find claims that superiority matters in nuclear dyads to be
    overstated.
  image: rashomon.png

