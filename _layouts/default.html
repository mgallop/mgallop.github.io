<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title %}{% assign full_title = page.title | append: " | " | append: site.title %}{% else %}{% assign full_title = site.title %}{% endif %}
  <title>{{ full_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ full_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:image" content="{{ site.url }}{{ site.photo }}">
  <meta name="twitter:card" content="summary">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Max Gallop",
    "url": "{{ site.url }}",
    "image": "{{ site.url }}{{ site.photo }}",
    "jobTitle": "{{ site.job_title }}",
    "knowsAbout": ["International conflict", "Quantitative methodology"],
    "email": "mailto:{{ site.email }}",
    "affiliation": {
      "@type": "CollegeOrUniversity",
      "name": "{{ site.institution }}",
      "department": { "@type": "Organization", "name": "{{ site.department }}" }
    },
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "Duke University" },
      { "@type": "CollegeOrUniversity", "name": "University of Chicago" }
    ],
    "sameAs": [{% for p in site.profiles %}"{{ p[1] }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]
  }
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">Max Gallop</a>
    <nav aria-label="Main">
      <a href="{{ '/research/' | relative_url }}"{% if page.url contains 'research' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/cv.pdf' | relative_url }}">CV</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
</body>
</html>
